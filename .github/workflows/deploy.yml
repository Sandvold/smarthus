name: Publiser siden
on:
  push:
    branches: [main]
    paths:
      - site/index.html
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Bare siden publiseres åpent, data ligger bak innlogging
        run: mkdir public && cp site/index.html public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4

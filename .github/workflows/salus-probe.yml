name: Undersøk Salus
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/collect_salus.py
        env:
          SALUS_EMAIL: ${{ secrets.SALUS_EMAIL }}
          SALUS_PASSWORD: ${{ secrets.SALUS_PASSWORD }}

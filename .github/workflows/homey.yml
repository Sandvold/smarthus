name: Homey-status
# Homey sender enhetsstatus (repository_dispatch, type homey). Kun lagring og publisering av homey.json,
# ikke de andre samlerne (disse startes herfra hvert kvarter via steget nederst; cron i collect.yml er reserve).
on:
  repository_dispatch:
    types: [homey]
permissions:
  contents: read
  actions: write
concurrency:
  group: homey
  cancel-in-progress: false
jobs:
  homey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]"
      - run: python scripts/ingest_homey.py "$GITHUB_EVENT_PATH"
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/export_homey.py
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/upload_site.py
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Start Salus-køen hvis det ligger kommandoer der
        env:
          GH_TOKEN: ${{ github.token }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          n=$(python - <<'PY'
          import os, psycopg
          try:
              with psycopg.connect(os.environ["NEON_DATABASE_URL"]) as c:
                  print(c.execute("select count(*) from salus_queue where status = 'ny' and created_at > now() - interval '3 hours'").fetchone()[0])
          except Exception:
              print(0)
          PY
          )
          echo "Ventende Salus-kommandoer: $n"
          if [ "${n:-0}" -gt 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/salus-cloud.yml/dispatches" -f ref=main -f 'inputs[mode]=queue'
            echo "Startet Salus sky (queue)"
          fi
      - name: Start Hent målinger hvis siste kjøring er over 10 min gammel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // empty')
          age=999999
          if [ -n "$last" ]; then age=$(( $(date +%s) - $(date -d "$last" +%s) )); fi
          echo "Siste Hent målinger: ${age}s siden"
          if [ "$age" -gt 600 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" -f ref=main
            echo "Startet Hent målinger"
          fi

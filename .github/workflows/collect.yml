name: Hent målinger
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [homey]
permissions:
  contents: read
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests "psycopg[binary]"
      - if: github.event_name == 'repository_dispatch'
        run: python scripts/ingest_homey.py "$GITHUB_EVENT_PATH"
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect.py
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_HOST: ${{ vars.TUYA_HOST }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect_tibber.py
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: pip install websockets
      - run: python scripts/collect_pulse.py
        continue-on-error: true
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect_zaptec.py
        continue-on-error: true
        env:
          ZAPTEC_USERNAME: ${{ secrets.ZAPTEC_USERNAME }}
          ZAPTEC_PASSWORD: ${{ secrets.ZAPTEC_PASSWORD }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect_microtemp.py
        continue-on-error: true
        env:
          OJ_USERNAME: ${{ secrets.OJ_USERNAME }}
          OJ_PASSWORD: ${{ secrets.OJ_PASSWORD }}
          OJ_API_KEY: ${{ secrets.OJ_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect_lg.py
        continue-on-error: true
        env:
          LG_THINQ_PAT: ${{ secrets.LG_THINQ_PAT }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/miele.py collect
        continue-on-error: true
        env:
          MIELE_CLIENT_ID: ${{ secrets.MIELE_CLIENT_ID }}
          MIELE_CLIENT_SECRET: ${{ secrets.MIELE_CLIENT_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect_aqara.py
        continue-on-error: true
        env:
          AQARA_APP_ID: ${{ secrets.AQARA_APP_ID }}
          AQARA_KEY_ID: ${{ secrets.AQARA_KEY_ID }}
          AQARA_APP_KEY: ${{ secrets.AQARA_APP_KEY }}
          AQARA_REGION: ${{ secrets.AQARA_REGION }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect_shelly.py
        env:
          SHELLY_SERVER: ${{ secrets.SHELLY_SERVER }}
          SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect_adax.py
        env:
          ADAX_ACCOUNT_ID: ${{ secrets.ADAX_ACCOUNT_ID }}
          ADAX_PASSWORD: ${{ secrets.ADAX_PASSWORD }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/collect_gardena.py
        env:
          GARDENA_CLIENT_ID: ${{ secrets.GARDENA_CLIENT_ID }}
          GARDENA_CLIENT_SECRET: ${{ secrets.GARDENA_CLIENT_SECRET }}
          GARDENA_CLIENT_ID_2: ${{ secrets.GARDENA_CLIENT_ID_2 }}
          GARDENA_CLIENT_SECRET_2: ${{ secrets.GARDENA_CLIENT_SECRET_2 }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/export_homey.py
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: python scripts/sync_ctl_secrets.py
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AQARA_APP_ID: ${{ secrets.AQARA_APP_ID }}
          AQARA_KEY_ID: ${{ secrets.AQARA_KEY_ID }}
          AQARA_APP_KEY: ${{ secrets.AQARA_APP_KEY }}
          AQARA_REGION: ${{ secrets.AQARA_REGION }}
          HOMEY_LOCK_URL: ${{ secrets.HOMEY_LOCK_URL }}
          SHELLY_SERVER: ${{ secrets.SHELLY_SERVER }}
          SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
          ADAX_ACCOUNT_ID: ${{ secrets.ADAX_ACCOUNT_ID }}
          ADAX_PASSWORD: ${{ secrets.ADAX_PASSWORD }}
          GARDENA_CLIENT_ID: ${{ secrets.GARDENA_CLIENT_ID }}
          GARDENA_CLIENT_SECRET: ${{ secrets.GARDENA_CLIENT_SECRET }}
          GARDENA_CLIENT_ID_2: ${{ secrets.GARDENA_CLIENT_ID_2 }}
          GARDENA_CLIENT_SECRET_2: ${{ secrets.GARDENA_CLIENT_SECRET_2 }}
          ZAPTEC_USERNAME: ${{ secrets.ZAPTEC_USERNAME }}
          ZAPTEC_PASSWORD: ${{ secrets.ZAPTEC_PASSWORD }}
      - run: python scripts/upload_site.py
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

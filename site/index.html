<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smarthus</title>
<style>
:root{--bg:#0f1110;--card:#181b1a;--tile:#1f2321;--fg:#f0efec;--mut:#9aa39d;--grid:#2a2f2d;--warn:#d8a747;--bad:#e08363;--ok:#93a877;--acc:#7eaddb}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;margin:0;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;color:var(--mut);font-weight:600;margin:16px 0 6px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
select,input,button{font:inherit;color:var(--fg)}
select,input[type=text]{background:var(--card);border:1px solid var(--grid);border-radius:8px;padding:8px 10px}
.nav{position:sticky;top:0;z-index:5;background:#0f1110ee;backdrop-filter:blur(6px);display:flex;gap:6px;overflow-x:auto;padding:8px 16px;margin:0 -16px 14px;border-bottom:1px solid var(--grid)}
.nav button{background:var(--card);border:1px solid var(--grid);border-radius:999px;padding:8px 16px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.nav button.on{background:#7eaddb22;border-color:var(--acc);color:var(--acc)}
.pill{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--bad);color:#111}.pill.w{background:var(--warn)}.pill.g{background:var(--grid);color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:6px}
.c,.tile{background:var(--tile);border-radius:10px;padding:12px}
.tile .n{font-size:26px;line-height:1.15}
.big{font-size:32px;line-height:1.1}
.s{color:var(--mut);font-size:13px}
.badge{display:inline-block;font-size:13px;border-radius:999px;padding:2px 10px;margin-top:6px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.lede{font-size:18px;line-height:1.5;max-width:62ch;margin:0 0 16px}
details.sec{background:var(--card);border-radius:12px;margin:0 0 10px;color:var(--fg);font-size:inherit}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px;min-height:48px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .t{font-weight:600;font-size:16px}
details.sec .sub{color:var(--mut);font-size:13px;margin-left:auto;text-align:right}
details.sec .chev{width:10px;height:10px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:4px}
details.sec[open]>summary .chev{transform:rotate(45deg)}
details.sec>.body{padding:0 14px 14px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mut);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart{position:relative}svg{width:100%;height:240px;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#000d;border:1px solid var(--grid);border-radius:8px;padding:6px 10px;font-size:13px;display:none;white-space:nowrap}
details.mini{margin-top:8px;color:var(--mut);font-size:13px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:3px 8px 3px 0}
.pc{background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:14px;text-align:left;cursor:pointer;width:100%}
.pc:hover{border-color:var(--acc)}.pc h2{display:flex;justify-content:space-between;align-items:center}
.pc div{font-size:14px;margin-top:3px}
.al{display:flex;gap:8px;padding:6px 0;font-size:15px;border-bottom:1px solid var(--grid)}.al:last-child{border:0;}.al .x{background:none;border:1px solid var(--grid);border-radius:8px;color:var(--mut);padding:2px 10px;cursor:pointer;font-size:13px;align-self:center}
.todo label{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid);align-items:flex-start;cursor:pointer}
.todo input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none}
.todo .d .x{text-decoration:line-through;color:var(--mut)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.add input{flex:1;min-width:200px}
.add button{background:var(--acc);color:#111;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
.empty{border:1px dashed var(--grid);border-radius:10px;padding:12px;color:var(--mut);font-size:14px}
.lv{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;margin-left:6px;border:1px solid #3a4248;color:#cfd6dc}.lv.l{border-color:#3f6b4a;color:#9ccaa6}.lv.m{border-color:#a8873a;color:#e0c277}.lv.h{border-color:#a65a47;color:#e69a87}
.ct dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:6px 12px}.ct dt{color:#8b959d;font-size:12px}.ct dd{margin:0;font-size:13px}.ct .src{font-size:11px;color:#7f8a93;margin-top:8px}
.sel{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px}.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}.chk input{width:18px;height:18px}.chk i{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<header><h1>Smarthus</h1>
<label class="s">Periode for grafer <select id="range"><option value="24">Siste 24 timer</option><option value="72">Siste 3 dager</option><option value="168" selected>Siste 7 dager</option><option value="336">Siste 14 dager</option></select></label></header>
<nav class="nav" id="nav"></nav>
<main id="main">Laster…</main>
<details class="mini" style="margin-top:20px"><summary>Om tallene</summary><p>Frostgrensen på 0 °C er et forslag, ikke noe du har valgt. Døgn regnes som de siste 24 timene. Kostnad per kWh er et anslag på 1,1 kr med Norgespris, nett og avgifter. Siden oppdateres omtrent hvert 15. minutt.</p></details>
<script>
const FROST=0,WARN_NEAR=3,LOW_BATT=30,STALE_MIN=60,RATE=1.1;
const PAL=['#7eaddb','#e08363','#93a877','#d8a747','#a97a9b','#b98e5a','#c9c2b3','#8d9aa3'];
const nf=(v,d=1)=>v==null||isNaN(v)?'–':v.toLocaleString('nb-NO',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt=d=>d.toLocaleString('nb-NO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);return m<2?'nå':m<90?m+' min siden':m<2880?Math.round(m/60)+' t siden':Math.round(m/1440)+' d siden'};
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PLACES={oslo:'Oslo',arendal:'Arendal',drivhus:'Drivhus'};
const placeOf=(site,name)=>/drivhus|oppvarmet/i.test((site||'')+' '+(name||''))?'drivhus':/oslo/i.test(site||'')?'oslo':'arendal';
let ALL=[],hours=168,PW=null,SH=null,AX=null,GD=null,HM=null,PU=null,ZP=null,MT=null,LG=null,MI=null,AQ=null;
let TAB=(location.hash||'#oversikt').slice(1);const OPEN={};
const tile=(l,v,u)=>{const e=v==null||v==='–';return `<div class="tile"><div class="s">${l}</div><div class="n">${e?'–':v}${e||!u?'':' '+u}</div></div>`};
const grid=h=>`<div class="cards">${h}</div>`;
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d};
function sec(key,title,sub,body,o={}){
 const d=document.createElement('details');d.className='sec';const k=TAB+'/'+key;
 d.open=k in OPEN?OPEN[k]:o.open!==false;
 d.innerHTML=`<summary><span class="t">${title}</span><span class="sub">${sub||''}</span><span class="chev"></span></summary><div class="body"></div>`;
 const b=d.querySelector('.body');typeof body==='string'?b.innerHTML=body:b.appendChild(body);
 d._draw=o.draw;d.addEventListener('toggle',()=>{OPEN[k]=d.open;if(d.open&&d._draw)d._draw()});return d}
const waiting=t=>`<div class="empty">${t}</div>`;
/* ---------- data ---------- */
const SERIES=()=>{const by={};ALL.filter(r=>r.kind!=='heatpump').forEach(r=>{(by[r.name]=by[r.name]||[]).push({t:new Date(r.ts),temp:r.temp,hum:r.hum,batt:r.battery,site:r.site})});
 ((AQ&&AQ.devices)||[]).forEach(d=>{const rows=d.rows.filter(r=>r.temp!=null).map(r=>({t:new Date(r.t),temp:r.temp,hum:r.hum,batt:null,site:d.site}));if(rows.length)by[d.name]=rows});
 return Object.entries(by).map(([name,rows],i)=>({name,color:PAL[i%PAL.length],rows,pl:placeOf(rows[rows.length-1].site,name)}))};
const sensors=pl=>SERIES().filter(s=>s.pl===pl);
const hmList=(pl,kind)=>((HM&&HM.devices)||[]).filter(c=>placeOf(c.site,c.name)===pl&&(!kind||c.kind===kind));
const gdList=pl=>((GD&&GD.devices)||[]).filter(c=>placeOf(c.site,c.name)===pl);
const axAvg=pl=>axList(pl).filter(c=>!(pl==='oslo'&&/vaskerom/i.test(c.name)));
const axList=pl=>((AX&&AX.rooms)||[]).filter(c=>placeOf(c.home,c.name)===pl);
const shList=()=>((SH&&SH.channels)||[]);
const pwList=pl=>((PW&&PW.homes)||[]).filter(h=>h.hourly&&h.hourly.length&&placeOf(h.site,h.name)===pl);
const hpRows=()=>ALL.filter(r=>r.kind==='heatpump').map(r=>({t:new Date(r.ts).getTime(),p:r.props||{},name:r.name}));
function pwStats(hm){const H=hm.hourly.map(r=>({t:new Date(r.from),kwh:r.kwh,cost:r.cost}));
 const tmax=Math.max(...H.map(r=>r.t.getTime()))+3600000,sum=(a,b)=>H.filter(r=>r.t.getTime()>tmax-b*3600000&&r.t.getTime()<=tmax-a*3600000).reduce((x,r)=>x+(r.kwh||0),0);
 const k24=sum(0,24),k7=sum(0,168),p7=sum(168,336);return{H,k24,k7,p7,ch:p7?Math.round((k7-p7)/p7*100):null}}
function shStats(c){const r=c.rows,last=r[r.length-1],cut=Date.now()-86400000,r24=r.filter(x=>new Date(x.t).getTime()>=cut),first=r24[0]||last;
 const kwh=(last.wh!=null&&first.wh!=null)?Math.max(0,(last.wh-first.wh)/1000):null,on=r24.filter(x=>x.on).length;
 return{last,kwh,share:r24.length?Math.round(on/r24.length*100):null}}
/* ---------- charts ---------- */
const chartBlock=id=>`<div class="legend" id="leg-${id}"></div><div class="chart" id="ch-${id}"></div><details class="mini"><summary>Tabell</summary><div id="tb-${id}"></div></details>`;
function chart(id,key,unit,refLine,pad,S){
 const since=Date.now()-hours*3600000;
 const sets=S.map(s=>({name:s.name,color:s.color,pts:s.rows.filter(r=>r.t>since&&r[key]!=null).map(r=>({t:r.t.getTime(),v:r[key]}))}));
 drawLine('ch-'+id,'leg-'+id,'tb-'+id,sets,key,unit,refLine,pad)}
function drawLine(id,legId,tbId,sets,key,unit,refLine,pad){
 const host=document.getElementById(id);if(!host)return;
 document.getElementById(legId).innerHTML=sets.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
 const all=sets.flatMap(s=>s.pts);
 if(!all.length){host.innerHTML='<div class="s">Ingen målinger i perioden</div>';return}
 const W=host.clientWidth||600,H=240,m={l:40,r:10,t:10,b:24};
 let t0=Math.min(...all.map(p=>p.t)),t1=Math.max(...all.map(p=>p.t));if(t1===t0)t1=t0+1;
 let lo=Math.min(...all.map(p=>p.v),...(refLine!=null?[refLine]:[])),hi=Math.max(...all.map(p=>p.v),...(refLine!=null?[refLine]:[]));
 lo-=pad;hi+=pad;if(hi===lo)hi=lo+1;
 const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r),Y=v=>H-m.b-(v-lo)/(hi-lo)*(H-m.t-m.b),d0=(key==='hum'||key==='pw')?0:1;
 let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#2a2f2d"/><text x="${m.l-6}" y="${y+4}" text-anchor="end" fill="#9aa39d" font-size="11">${nf(v,d0)}</text>`}
 for(let i=0;i<=3;i++){const t=t0+(t1-t0)*i/3;g+=`<text x="${X(t)}" y="${H-6}" text-anchor="${i==0?'start':i==3?'end':'middle'}" fill="#9aa39d" font-size="11">${new Date(t).toLocaleString('nb-NO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</text>`}
 if(refLine!=null)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(refLine)}" y2="${Y(refLine)}" stroke="#e08363" stroke-dasharray="4 4"/><text x="${W-m.r}" y="${Y(refLine)-4}" text-anchor="end" fill="#e08363" font-size="11">Frost ${refLine} °C</text>`;
 const lines=sets.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" points="${s.pts.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"/>`+(s.pts.length===1?`<circle cx="${X(s.pts[0].t)}" cy="${Y(s.pts[0].v)}" r="4" fill="${s.color}"/>`:'')).join('');
 host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf over tid">${g}${lines}<line id="${id}-x" y1="${m.t}" y2="${H-m.b}" stroke="#9aa39d" style="display:none"/></svg><div class="tip" id="${id}-tip"></div>`;
 const svg=host.querySelector('svg'),xl=document.getElementById(id+'-x'),tip=document.getElementById(id+'-tip');
 const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,t=t0+(px-m.l)/(W-m.l-m.r)*(t1-t0);
  const rows=sets.map(s=>{if(!s.pts.length)return null;let b=s.pts[0];s.pts.forEach(p=>{if(Math.abs(p.t-t)<Math.abs(b.t-t))b=p});return{s,b}}).filter(Boolean);
  if(!rows.length)return;const ref=rows[0].b.t;xl.setAttribute('x1',X(ref));xl.setAttribute('x2',X(ref));xl.style.display='';
  tip.innerHTML=`<div class="s">${fmt(new Date(ref))}</div>`+rows.map(o=>`<div><i class="dot" style="background:${o.s.color}"></i>${o.s.name}: ${nf(o.b.v,d0)} ${unit}</div>`).join('');
  tip.style.display='block';tip.style.left=Math.min(Math.max(X(ref)/W*r.width+10,0),r.width-tip.offsetWidth)+'px';tip.style.top='8px'};
 svg.addEventListener('pointermove',move);svg.addEventListener('pointerleave',()=>{xl.style.display='none';tip.style.display='none'});
 const rows=sets.flatMap(s=>s.pts.slice(-30).reverse().map(p=>({n:s.name,t:p.t,v:p.v}))).sort((a,b)=>b.t-a.t).slice(0,40);
 document.getElementById(tbId).innerHTML='<table><tr><th>Tidspunkt</th><th>Enhet</th><th>Verdi</th></tr>'+rows.map(r=>`<tr><td>${fmt(new Date(r.t))}</td><td>${r.n}</td><td>${nf(r.v,d0)} ${unit}</td></tr>`).join('')+'</table>'}
function bars(id,items,unit,dec,color){
 const host=document.getElementById(id);if(!host)return;if(!items.length){host.innerHTML='<div class="s">Ingen data</div>';return}
 const W=host.clientWidth||600,H=220,m={l:40,r:6,t:8,b:24},mx=Math.max(...items.map(i=>i.v),0.001)*1.1,bw=(W-m.l-m.r)/items.length;
 let g='';for(let i=0;i<=4;i++){const v=mx*i/4,y=H-m.b-(v/mx)*(H-m.t-m.b);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#2a2f2d"/><text x="${m.l-6}" y="${y+4}" text-anchor="end" fill="#9aa39d" font-size="11">${nf(v,dec)}</text>`}
 const step=Math.ceil(items.length/Math.max(2,Math.floor(W/70)));
 items.forEach((it,i)=>{const h=(it.v/mx)*(H-m.t-m.b),x=m.l+i*bw+1;g+=`<rect x="${x}" y="${H-m.b-h}" width="${Math.max(1,bw-2)}" height="${h}" rx="2" fill="${color}"><title>${it.tip}: ${nf(it.v,dec)} ${unit}</title></rect>`;
  if(i%step===0)g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" fill="#9aa39d" font-size="11">${it.lab}</text>`});
 host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Søylediagram">${g}</svg>`}
/* ---------- kort ---------- */
function sensorCard(s){const last=s.rows[s.rows.length-1],since=Date.now()-86400000,day=s.rows.filter(r=>r.t>since&&r.temp!=null).map(r=>r.temp);
 const mn=day.length?Math.min(...day):null,mx=day.length?Math.max(...day):null;let cls='ok',txt='✓ Over frost';
 if(last.temp!=null&&last.temp<=FROST){cls='bad';txt='⚠ Frost'}else if(last.temp!=null&&last.temp<=WARN_NEAR){cls='warn';txt='▲ Nær frost'}
 const stale=(Date.now()-last.t)/60000>STALE_MIN,bt=last.batt!=null&&last.batt<LOW_BATT?` · <span class="warn">⚠ lavt batteri</span>`:'';
 return `<div class="c"><h2><i class="dot" style="background:${s.color}"></i>${s.name}</h2><div class="big">${nf(last.temp)} °C</div><span class="badge ${cls}">${txt}</span>
 <div class="s" style="margin-top:8px">Fuktighet ${nf(last.hum,0)} % · siste døgn ${nf(mn)} til ${nf(mx)} °C</div><div class="s">Batteri ${nf(last.batt,0)} %${bt}</div>
 <div class="s ${stale?'warn':''}">${stale?'⚠ Ingen ny måling siden ':'Oppdatert '}${fmt(last.t)}</div></div>`}
const HIDE=/^(cmd_|mow_map|mower_volume|child_lock|firmware_update|secure_lock|lock_unlock_open|alarm_generic|swing_mode|fan_mode\.(speed|powerful)|cutting_height|mow_efficiency|collision|meter_power)/;
const HNAME={measure_battery:'Batteri',measure_humidity:'Fuktighet',charging_status:'Lading',consumable_blade:'Knivslitasje %',alarm_contact:'Dør åpen',alarm_battery:'Lavt batteri',measure_temperature:'Temperatur',target_temperature:'Innstilt',onoff:'På',locked:'Låst',thermostat_mode:'Modus',lawn_mower_state:'Status',measure_power:'Effekt','measure_temperature.outdoorTemperature':'Ute','fan_mode.mode':'Vifte'};
function homeyCard(c){if(c.kind==='mower')return mowerCard(c);const l=c.rows[c.rows.length-1],d=l.d||{},stale=Date.now()-new Date(l.t)>3*3600000||l.av===false;let main='–';
 if(c.kind==='lock'&&'locked' in d)main=d.locked?'Låst':'Ulåst';
 else if(c.kind==='daikin'&&d.measure_temperature!=null)main=nf(d.measure_temperature,1)+' °C';
 else if(c.kind==='mower'){const st=Object.entries(d).find(([k,v])=>typeof v==='string'&&/state|status|mode/i.test(k));main=st?String(st[1]).replace(/_/g,' '):(d.measure_battery!=null?nf(d.measure_battery,0)+' %':'–')}
 const extra=Object.entries(d).filter(([k])=>k!=='locked'&&!(c.kind==='lock'&&k==='alarm_contact')&&!HIDE.test(k)&&!(c.kind==='daikin'&&k==='measure_temperature')&&!(c.kind==='mower'&&k==='mower_status')).slice(0,6).map(([k,v])=>(HNAME[k]||k.replace(/^(measure_|alarm_|meter_)/,'').replace(/^temperature\./,'').replace(/_/g,' '))+': '+(typeof v==='boolean'?(v?'ja':'nei'):typeof v==='number'?nf(v,v%1?1:0):String(v).replace(/_/g,' '))).join(' · ');
 return `<div class="tile"><div class="s">${c.name}</div><div class="n" style="font-size:24px">${main}</div><div class="s">${extra}</div><div class="s"${stale?' style="color:#d8a747"':''}>${stale?'Frakoblet · ':''}oppdatert ${ago(l.t)}</div></div>`}
function gardenaCard(c){const l=c.rows[c.rows.length-1],off=l.link==='OFFLINE';
 const main=c.kind==='sensor'?(l.temp==null?'–':nf(l.temp,0)+' °C jord'):(l.act==='CLOSED'?'Ventil lukket':l.act||'–');
 const sub=[c.kind==='sensor'&&l.hum!=null?'Jordfukt '+nf(l.hum,0)+' %':null,l.batt!=null?'Batteri '+l.batt+' %':null,off?'Frakoblet, tallene kan være gamle':null].filter(Boolean).join(' · ');
 return `<div class="tile"><div class="s">${c.name}</div><div class="n" style="font-size:24px">${main}</div><div class="s"${off?' style="color:#d8a747"':''}>${sub}</div></div>`}
function adaxCard(c){const last=c.rows[c.rows.length-1],cut=Date.now()-86400000,v=c.rows.filter(x=>new Date(x.t).getTime()>=cut&&x.temp!=null).map(x=>x.temp);
 return `<div class="tile"><div class="s">${c.name}</div><div class="n">${last.temp==null?'–':nf(last.temp,1)+' °C'}</div><div class="s">Innstilt ${nf(last.target,1)} °C${last.on?'':' · av'}${v.length?' · 24 t: '+nf(Math.min(...v),1)+'–'+nf(Math.max(...v),1)+' °C':''}</div></div>`}
function shellyCard(c){const s=shStats(c);return `<div class="tile"><div class="s">${c.name}</div><div class="n">${s.last.on?'På':'Av'}${s.last.w!=null?' · '+nf(s.last.w,0)+' W':''}</div><div class="s">24 t: ${s.kwh==null?'–':nf(s.kwh,2)+' kWh'}${s.share==null?'':' · på '+s.share+' % av tiden'}</div></div>`}

 const arch=el('<div class="ct">'+CTRL_ARK.map(a=>`<p><b>${a[0]}.</b> ${a[1]}</p>`).join('')+'</div>');
 w.appendChild(sec('ctrl-ark','Hvordan styring kan bygges','Innlogging, hastighet og sikkerhet',arch,{open:true}));

 w.appendChild(sec('ctrl-ord','Anbefalt rekkefølge','Fra enklest og tryggest',el('<div class="ct">'+CTRL_ORDER.map(o=>`<p><b>${o[0]}.</b> ${o[1]}</p>`).join('')+'</div>'),{open:true}));

 return w}

function todoView(){const w=document.createElement('div'),done=ls.get('sh-done',{}),extra=ls.get('sh-extra',[]);
 const all=TODO.map(([c,id,t,n])=>({c,id,t,n})).concat(extra);const cats=[...new Set(['Datakilder','Dashboard','Sikkerhet',...all.map(x=>x.c)])];
 w.appendChild(el(`<p class="s">Avkrysninger og egne punkter lagres bare i denne nettleseren. Skriv til meg hvis noe skal inn i den faste listen.</p>`));
 cats.forEach(c=>{const L=all.filter(x=>x.c===c);if(!L.length)return;const n=L.filter(x=>done[x.id]).length;
  const b=el(`<div class="todo">${L.map(x=>`<label><input type="checkbox" data-id="${x.id}" ${done[x.id]?'checked':''}><span class="d"><span class="${done[x.id]?'x':''}">${x.t}</span>${x.n?`<div class="s">${x.n}</div>`:''}</span></label>`).join('')}</div>`);
  b.querySelectorAll('input').forEach(i=>i.onchange=()=>{done[i.dataset.id]=i.checked;ls.set('sh-done',done);render()});
  w.appendChild(sec('todo-'+c,c,`${n} av ${L.length} gjort`,b))});
 const f=el(`<div class="add"><input type="text" id="nt" placeholder="Nytt punkt"><select id="nc">${cats.map(c=>`<option>${c}</option>`).join('')}</select><button id="na">Legg til</button></div>`);
 f.querySelector('#na').onclick=()=>{const t=f.querySelector('#nt').value.trim();if(!t)return;extra.push({c:f.querySelector('#nc').value,id:'x'+Date.now(),t,n:''});ls.set('sh-extra',extra);render()};
 w.appendChild(f);
 w.appendChild(sec('done','Ferdig',DONE.length+' punkter',el('<div class="todo">'+DONE.map(x=>`<label style="cursor:default"><input type="checkbox" checked disabled><span class="d"><span class="x">${x[0]}</span>${x[1]?`<div class="s">${x[1]}</div>`:''}</span></label>`).join('')+'</div>'),{open:false}));return w}
const todoOpen=()=>{const done=ls.get('sh-done',{});return TODO.filter(x=>!done[x[1]]).length+ls.get('sh-extra',[]).filter(x=>!done[x.id]).length};
/* ---------- app ---------- */
const TABS=[['oversikt','Oversikt'],['oslo','Oslo'],['arendal','Arendal'],['drivhus','Drivhus'],['styring','Styring'],['todo','Gjøremål']];
function go(t){TAB=t;history.replaceState(null,'','#'+t);render();scrollTo(0,0)}
function nav(){const n=alerts().filter(a=>a.lvl!=='info').length;
 document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}">${l}${k==='oversikt'&&n?`<span class="pill w">${n}</span>`:''}${k==='todo'?`<span class="pill g">${todoOpen()}</span>`:''}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t))}
function render(){if(!TABS.some(t=>t[0]===TAB))TAB='oversikt';nav();const m=document.getElementById('main');m.innerHTML='';
 m.appendChild(TAB==='oversikt'?overview():TAB==='todo'?todoView():TAB==='styring'?ctrlView():placeView(TAB));
 m.querySelectorAll('details.sec').forEach(d=>{if(d.open&&d._draw)d._draw()})}
document.getElementById('range').addEventListener('change',e=>{hours=+e.target.value;render()});
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(render,150)});
addEventListener('hashchange',()=>{TAB=(location.hash||'#oversikt').slice(1);render()});
const J=f=>fetch(f).then(r=>r.ok?r.json():null).catch(()=>null);
Promise.all([J('homey.json'),J('gardena.json'),J('adax.json'),J('shelly.json'),J('power.json'),J('data.json'),J('pulse.json'),J('zaptec.json'),J('microtemp.json'),J('lg.json'),J('miele.json'),J('aqara.json')]).then(([h,g,a,s,p,d,u,z,m,lg,mi,aq])=>{AQ=aq;LG=lg;MI=mi;MT=m;ZP=z;PU=u;HM=h;GD=g;AX=a;SH=s;PW=p;ALL=d||[];render()}).catch(()=>{document.getElementById('main').textContent='Kunne ikke laste data'});

<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smarthus</title>
<style>
:root{--bg:#0a0d0c;--card:#141917;--tile:#1a211f;--fg:#f2f1ee;--mut:#98a39d;--grid:#262e2b;--warn:#e3b252;--bad:#f0866a;--ok:#8fc58a;--acc:#7eaddb;--oslo:#7eaddb;--arendal:#8fc58a;--drivhus:#e3b252;--pl:var(--acc)}
body[data-tab=oslo]{--pl:var(--oslo)}body[data-tab=arendal]{--pl:var(--arendal)}body[data-tab=drivhus]{--pl:var(--drivhus)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:radial-gradient(900px 420px at 88% -8%,#24485a55,transparent 62%),radial-gradient(800px 460px at -8% 6%,#2f5a3544,transparent 58%),var(--bg);background-attachment:fixed;color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:14px 14px 120px;max-width:1100px;margin-inline:auto}
h1{font-size:22px;margin:0;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 8px}h3{font-size:12px;color:var(--mut);font-weight:600;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.07em}
button,select,input{font:inherit;color:var(--fg)}button{cursor:pointer}
select,input[type=text]{background:#ffffff0a;border:1px solid var(--grid);border-radius:10px;padding:8px 10px}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;background:#101614e8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff14;border-radius:24px;padding:6px;box-shadow:0 14px 40px #000b;max-width:calc(100% - 16px)}

.chart{position:relative}svg{width:100%;height:240px;display:block;touch-action:pan-y}

.sel{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px}.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}.chk input{width:18px;height:18px}.chk i{width:10px;height:10px;border-radius:50%;display:inline-block}

.btn.sq{width:38px;padding:8px 0;font-size:18px;line-height:1}
.btn:disabled{opacity:.45;pointer-events:none}
/* styring */
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fb{background:#ffffff0d;border:1px solid #ffffff14;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--mut)}
.fb.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc);color:var(--fg)}.fb.rf{margin-left:auto}
.gh{margin:20px 2px 8px}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.dc{--pl:var(--acc);position:relative;display:flex;flex-direction:column;gap:6px;background:linear-gradient(160deg,#1f2825,#161c1a);border:1px solid #ffffff0d;border-radius:18px;padding:13px;transition:border-color .2s,box-shadow .2s}
.dc.on{border-color:color-mix(in srgb,var(--pl) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--pl) 25%,transparent),0 8px 26px color-mix(in srgb,var(--pl) 14%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--pl) 16%,#1f2825),#161c1a)}
.dc-top{display:flex;align-items:center;gap:9px}
.dc-ic{width:32px;height:32px;border-radius:10px;background:#ffffff10;display:grid;place-items:center;flex:none;color:var(--mut)}
.dc.on .dc-ic{background:color-mix(in srgb,var(--pl) 30%,transparent);color:var(--pl)}
.dc-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;height:19px}
.dc-nm{min-width:0;line-height:1.2}.dc-nm b{display:block;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dc-nm span{font-size:11px;color:var(--mut)}
.dc-dot{width:9px;height:9px;border-radius:50%;background:#59615d;margin-left:auto;flex:none}
.dc.ok .dc-dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dc.warn .dc-dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}.dc.bad .dc-dot{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.dc-st{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.dc-sub{font-size:12px;color:var(--mut);min-height:16px}
.dc-ctl{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.dc-btns{display:flex;gap:6px;flex-wrap:wrap}.dc-btns .btn{flex:1;min-width:70px;padding:9px 8px}
.stp{display:grid;grid-template-columns:38px 1fr 38px;gap:6px;align-items:center}
.stp .sv{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}.stp [data-sset]{grid-column:1/-1}
.dc.busy::after{content:"";position:absolute;inset:0;border-radius:18px;background:linear-gradient(100deg,transparent 30%,#ffffff14 50%,transparent 70%);background-size:200% 100%;animation:sh 1.1s linear infinite;pointer-events:none}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
/* toast og bekreftelse */
.toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:96px;z-index:40;background:#1d2623;border:1px solid #ffffff1c;border-radius:14px;padding:10px 16px;font-size:14px;box-shadow:0 12px 32px #000b;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 28px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:var(--bad);color:var(--bad)}.toast.warn{border-color:var(--warn)}
.ov{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:#151b19;border:1px solid #ffffff1a;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px;animation:up .18s}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet p{margin:0 0 16px;font-size:17px;white-space:pre-line}.sheet .row{display:flex;gap:10px}.sheet .btn{flex:1;padding:13px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}.dg{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
</style>
</head>
<body>
<div class="top"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg></span>Smarthus</div>
<div id="rw"><label class="s">Grafer <select id="range"><option value="24">24 timer</option><option value="72">3 dager</option><option value="168" selected>7 dager</option><option value="336">14 dager</option></select></label><div class="s" id="upd"></div></div></div>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>
<main id="main">Laster…</main>
<details class="mini" style="margin-top:20px"><summary>Om tallene</summary><p>Frostgrensen på 0 °C er et forslag, ikke noe du har valgt. Døgn regnes som de siste 24 timene. Kostnad per kWh er et anslag på 1,1 kr med Norgespris, nett og avgifter. Siden oppdateres omtrent hvert 15. minutt.</p></details>
<script>
const FROST=0,WARN_NEAR=3,LOW_BATT=30,STALE_MIN=60,RATE=1.1;
const PAL=['#7eaddb','#e08363','#93a877','#d8a747','#a97a9b','#b98e5a','#c9c2b3','#8d9aa3'];
const nf=(v,d=1)=>v==null||isNaN(v)?'–':v.toLocaleString('nb-NO',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt=d=>d.toLocaleString('nb-NO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);return m<2?'nå':m<90?m+' min siden':m<2880?Math.round(m/60)+' t siden':Math.round(m/1440)+' d siden'};
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PLACES={oslo:'Oslo',arendal:'Arendal',drivhus:'Drivhus',alle:'Alle steder'};
const placeOf=(site,name)=>/drivhus|oppvarmet/i.test((site||'')+' '+(name||''))?'drivhus':/oslo/i.test(site||'')?'oslo':'arendal';
let ALL=[],hours=168,PW=null,SH=null,AX=null,GD=null,HM=null,PU=null,ZP=null,MT=null,LG=null,MI=null,AQ=null,SA=null;
let TAB=(location.hash||'#oversikt').slice(1);const OPEN={};
const tile=(l,v,u)=>{const e=v==null||v==='–';return `<div class="tile"><div class="s">${l}</div><div class="n">${e?'–':v}${e||!u?'':' '+u}</div></div>`};
const grid=h=>`<div class="cards">${h}</div>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d};
const ICO={grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
 sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 city:'<path d="M4 20V9l5-3v14M9 20V4l7 3v13M16 20v-8l4 2v6M3 20h18"/>',
 house:'<path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/>',
 leaf:'<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14M5 19c3-5 6-8 10-10"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 mower:'<rect x="3" y="10" width="14" height="6" rx="2"/><circle cx="7" cy="18" r="2"/><circle cx="15" cy="18" r="2"/><path d="M17 12h4M8 10V6h4"/>',
 drop:'<path d="M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-6 6-11z"/>',
 power:'<path d="M12 3v8M7.5 6.5a7 7 0 109 0"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>',
 fan:'<circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7 2 0 2 3 0 5M14 12c4 0 7 1 7 4 0 2-3 2-5 0M12 14c0 4-1 7-4 7-2 0-2-3 0-5M10 12c-4 0-7-1-7-4 0-2 3-2 5 0"/>',
 flame:'<path d="M12 3c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4 0-7 1-10z"/>',
 wind:'<path d="M3 9h11a3 3 0 10-3-3M3 15h15a3 3 0 11-3 3M3 12h7"/>',
 car:'<path d="M5 17V7a2 2 0 012-2h6a2 2 0 012 2v10M4 20h12M15 9h2a2 2 0 012 2v5a1.5 1.5 0 003 0V9l-2-2"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICO[n]||ICO.power}</svg>`;
const sleep=ms=>new Promise(z=>setTimeout(z,ms));
const lastOf=a=>a&&a.length?a[a.length-1]:null;
const BUSY={},PEND={};
let _toastT=null;
function toast(t,tone){const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.className='toast show'+(tone?' '+tone:'');clearTimeout(_toastT);_toastT=setTimeout(()=>{e.className='toast'},tone==='bad'?7000:4500)}
function ask(text,okLabel){return new Promise(res=>{const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><p></p><div class="row"><button class="btn" data-n>Avbryt</button><button class="btn pri" data-y></button></div></div>`;
 o.querySelector('p').textContent=text;o.querySelector('[data-y]').textContent=okLabel||'Ja, utfør';
 const done=v=>{document.removeEventListener('keydown',kd);o.remove();res(v)},kd=e=>{if(e.key==='Escape')done(false)};
 o.onclick=e=>{if(e.target===o)done(false)};o.querySelector('[data-n]').onclick=()=>done(false);o.querySelector('[data-y]').onclick=()=>done(true);
 document.addEventListener('keydown',kd);document.body.appendChild(o);o.querySelector('[data-y]').focus()})}
function softRender(){clearTimeout(softRender.t);softRender.t=setTimeout(()=>{const a=document.activeElement;
 if(a&&/^(SELECT|INPUT)$/.test(a.tagName)&&a.closest&&a.closest('#main')){softRender();return}
 const y=scrollY;render();scrollTo(0,y)},80)}
function setBusy(k,v){if(v)BUSY[k]=1;else delete BUSY[k];softRender()}
/* ---------- live status: skriv ny tilstand inn i dataene, så alle visninger viser det samme ---------- */
function pushRow(c,patch,ts){const l=lastOf(c&&c.rows);if(!l)return false;if(ts&&new Date(ts)<=new Date(l.t))return false;
 Object.keys(patch).forEach(k=>patch[k]===undefined&&delete patch[k]);
 if(!Object.keys(patch).length||Object.keys(patch).every(k=>l[k]===patch[k]))return false;
 c.rows.push(Object.assign({},l,patch,{t:ts||new Date().toISOString()}));return true}
const injAq=(did,s,ts)=>{const d=AQ&&(AQ.devices||[]).find(x=>x.did===did);return !!d&&!!s&&pushRow(d,{on:s.on==null?undefined:s.on,power:s.power==null?undefined:s.power},ts)};
const injShelly=(id,s,ts)=>{const c=SH&&(SH.channels||[]).find(x=>x.id===id);return !!c&&!!s&&pushRow(c,{on:s.on==null?undefined:!!s.on,w:s.power==null?undefined:s.power},ts)};
const injAdax=(id,target,ts)=>{const c=AX&&(AX.rooms||[]).find(x=>String(x.id)===String(id));return !!c&&target!=null&&pushRow(c,{target},ts)};
const injGd=(id,state)=>{const c=GD&&(GD.devices||[]).find(x=>x.id===id);return !!c&&state!=null&&pushRow(c,{act:state})};
const injZp=(id,m)=>{const c=ZP&&(ZP.chargers||[]).find(x=>x.id===id);return !!c&&m!=null&&pushRow(c,{m})};
const injMt=(serial,j)=>{const c=MT&&(MT.thermostats||[]).find(x=>String(x.serial)===String(serial));return !!c&&pushRow(c,{mode:j.mode==null?undefined:j.mode,set:j.set==null?undefined:j.set})};
function injNested(c,patch){const l=lastOf(c&&c.rows);if(!l)return false;Object.keys(patch).forEach(k=>patch[k]===undefined&&delete patch[k]);const d=l.d||{};
 if(!Object.keys(patch).length||Object.keys(patch).every(k=>d[k]===patch[k]))return false;c.rows.push(Object.assign({},l,{d:Object.assign({},d,patch),t:new Date().toISOString(),av:true}));return true}
const injDk=p=>injNested(((HM&&HM.devices)||[]).find(c=>c.kind==='daikin'),p);
const injMower=(dv,status)=>{const c=((HM&&HM.devices)||[]).find(x=>x.kind==='mower'&&(dv==='a3'?/A3/:/A1/).test(x.name));return !!c&&!!status&&injNested(c,{mower_status:String(status)})};

 if(ch)softRender()}
async function livePlugs(){const g=await ctlCall('GET',undefined,'?cached=1');if(!(g.ok&&g.j.plugs))return;let ch=false;
 for(const [k,s] of Object.entries(g.j.plugs)){if(!s)continue;
  if(k==='terrasse'){if(injectLock(s))ch=true}
  else if(k==='inngang'){if(injectLock(s,'Inngangsdør'))ch=true}
  else if(k.startsWith('adax:')){if(injAdax(k.slice(5),s.power,s.ts))ch=true}
  else if(k.startsWith('shelly:')){if(injShelly(k.slice(7),{on:s.on,power:s.power},s.ts))ch=true}
  else if(injAq(k,s,s.ts))ch=true}
 if(ch)softRender()}
const LIVE={};
async function plug(did,on){const nm=PLUGS[did],k='aq:'+did;if(!nm||BUSY[k])return;
 if(!await ask('Slå '+(on?'PÅ ':'AV ')+nm+'?',on?'Slå på':'Slå av'))return;
 LIVE[did]=(LIVE[did]||0)+1;const my=LIVE[did];setBusy(k,1);toast('Sender …');
 const r=await ctlCall('POST',{did,on});
 if(!r.ok){setBusy(k,0);toast('Feilet: '+(r.j.error||r.status),'bad');return}
 await sleep(2000);
 const one=async()=>{const g=await ctlCall('GET',undefined,'?did='+did);return g.ok&&g.j.plugs&&g.j.plugs[did]};
 const st=await one();let t;
 if(st&&st.on!=null){injAq(did,st);t=st.on===on?'Bekreftet: '+nm+' er '+(on?'på':'av'):'Enheten svarte ikke ennå (står '+(st.on?'på':'av')+')'}else t='Sendt (kunne ikke bekrefte)';
 setBusy(k,0);toast(t+' ('+hhmmNow()+')',st&&st.on===on?'':'warn');
 if(on&&st&&st.on){for(let i=0;i<24&&LIVE[did]===my;i++){await sleep(5000);if(LIVE[did]!==my)break;const s2=await one();if(!s2)break;if(injAq(did,s2))softRender();if(s2.on===false)break}}}
async function lockTerrasse(b,unlock,door){door=door||'terrasse';const nm=door==='inngang'?'Inngangsdør':'Terrasedør',k='lk:'+door,tc=(HM&&HM.devices||[]).find(x=>x.name===nm),d=lastOf(tc&&tc.rows)?lastOf(tc.rows).d||{}:{};
 if(BUSY[k])return;const dn=door==='inngang'?'inngangsdøren':'terrassedøren';
 const ok=unlock?await ask('Låse OPP '+dn+'?','Lås opp'):await ask('Låse '+dn+'?'+(d.alarm_contact?'\n\nObs: dørsensoren melder at døren kan stå åpen. Låsing mot åpen dør kan skade låsen.':''),'Lås');
 if(!ok)return;
 setBusy(k,1);toast('Sender til Homey …');
 const t0=Date.now()-2000,want=!unlock,r=await ctlCall('POST',unlock?{lock:door,unlock:true}:{lock:door});
 if(!r.ok){setBusy(k,0);toast('Feilet: '+(r.j.error||r.status),'bad');return}
 for(let i=0;i<10;i++){await sleep(3000);const g=await ctlCall('GET',undefined,'?cached=1');const s=g.ok&&g.j.plugs&&g.j.plugs[door];
  if(s&&s.ts&&new Date(s.ts).getTime()>t0){const tm=new Date(s.ts).toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'});
   injectLock(s,nm);setBusy(k,0);
   toast((!!s.on)===want?'Bekreftet: '+nm+' er '+(s.on?'låst':'ulåst')+' ('+tm+')':nm+' står fortsatt '+(s.on?'låst':'ulåst')+' ('+tm+')',(!!s.on)===want?'':'warn');return}}
 setBusy(k,0);toast('Kommando sendt, men ingen statusrapport fra Homey. Sjekk i Yale-appen.','warn')}
async function act(b,o){const key=o.act==='microtemp'?'mt:'+o.serial:o.act==='tuya'?'hp':o.act==='homey'?(o.dev==='daikin'?'dk':'mw:'+o.dev):o.act==='shelly'?'sh:'+o.cid:o.act==='adax'?'ax:'+o.room:o.act==='gardena'?'gd:'+o.id:'zp:'+o.id;
 if(BUSY[key])return;if(!await ask(o.q||'Utføre?'))return;const body=Object.assign({},o);delete body.q;delete body.cid;
 setBusy(key,1);toast('Sender …');
 const r=await ctlCall('POST',body);
 if(!r.ok){setBusy(key,0);toast('Feilet: '+(r.j.error||r.status),'bad');return}
 const j=r.j;let t;
 if(o.act==='shelly'){if(j.state!=null)injShelly(o.cid,{on:j.state,power:j.power});t=j.state==null?'Sendt (kunne ikke bekrefte)':j.state===o.on?'Bekreftet: '+(o.on?'på':'av'):'Enheten svarte ikke ennå (står '+(j.state?'på':'av')+')'}
 else if(o.act==='adax'){injAdax(o.room,j.state!=null?j.state:o.target);t=j.state!=null&&Math.abs(j.state-o.target)<0.01?'Bekreftet: innstilt '+nf(j.state,1)+' °C':'Sendt til Adax. Ovnen kan bruke litt tid på å følge etter'}
 else if(o.act==='gardena'){if(j.state)injGd(o.id,j.state);t=o.cmd==='start'?(j.state&&j.state!=='CLOSED'?'Bekreftet: vanner':'Sendt. Ventilen viser '+(j.state||'ukjent')+' ennå'):(j.state==='CLOSED'?'Bekreftet: stoppet':'Sendt. Ventilen viser '+(j.state||'ukjent')+' ennå')}
 else if(o.act==='microtemp'){injMt(o.serial,j);t=j.mode===3?'Bekreftet: manuell, '+nf(j.set,1)+' °C':j.mode===1?'Bekreftet: følger timeplan':'Sendt. Modus nå '+j.mode}
 else if(o.act==='tuya'){injHp({switch:j.on===undefined?undefined:!!j.on,temp_set:j.temp==null?undefined:j.temp});t='Bekreftet: '+(j.on===false?'av':'på')+(j.temp!=null?', innstilt '+j.temp+' °C':'')}
 else if(o.act==='homey'){if(o.dev==='daikin'){injDk({onoff:j.on==null?undefined:!!j.on,target_temperature:j.temp==null?undefined:j.temp});t=j.status?'Bekreftet: '+(j.on===false?'av':'på')+(j.temp!=null?', innstilt '+nf(j.temp,1)+' °C':''):'Sendt til Homey. Ingen statusrapport ennå, sjekk igjen om litt'}
  else{if(j.status)injMower(o.dev,j.status);t=j.status?'Klipperen melder: '+String(j.status).replace(/_/g,' '):'Sendt til Homey. Ingen statusrapport ennå, sjekk igjen om litt'}}
 else{if(j.state!=null)injZp(o.id,j.state);t=o.cmd==='pause'?(j.state===5?'Bekreftet: pauset':'Sendt. Laderen viser modus '+j.state+' ennå'):(j.state===3?'Bekreftet: lader':'Sendt. Laderen viser modus '+j.state+' ennå')}
 setBusy(key,0);toast(t+' ('+hhmmNow()+')',/^(Bekreftet|Klipperen melder)/.test(t)?'':'warn')}
window.act=act;window.daikinSet=daikinSet;window.hpSet=hpSet;window.mtSet=mtSet;
window.lockTerrasse=lockTerrasse;
window.plug=plug;
const J=f=>Promise.resolve(FILES&&FILES[f]!=null?FILES[f]:null);
function loginScreen(msg,out){const m=document.getElementById('main');
 m.innerHTML=`<div style="max-width:340px;margin:70px auto;text-align:center"><h2 style="margin:0 0 6px">Smarthus</h2><p class="s" style="margin:0 0 20px">${msg||'Logg inn for å se dataene.'}</p><button id="lg" style="font:inherit;padding:10px 18px;border-radius:8px;border:1px solid #444;background:#222;color:inherit;cursor:pointer">${out?'Logg ut':'Logg inn med Google'}</button></div>`;
 document.getElementById('lg').onclick=async()=>{try{if(out){await AUTHC.signOut();location.reload()}else await AUTHC.signIn.social({provider:'google',callbackURL:location.origin+location.pathname})}catch(e){loginScreen('Feil: '+(e&&e.message||e))}}}
function start(){Promise.all([J('homey.json'),J('gardena.json'),J('adax.json'),J('shelly.json'),J('power.json'),J('data.json'),J('pulse.json'),J('zaptec.json'),J('microtemp.json'),J('lg.json'),J('miele.json'),J('aqara.json'),J('salus.json')]).then(([h,g,a,s,p,d,u,z,m,lg,mi,aq,sa])=>{SA=sa;AQ=aq;LG=lg;MI=mi;MT=m;ZP=z;PU=u;HM=h;GD=g;AX=a;SH=s;PW=p;ALL=d||[];render();livePlugs().catch(()=>{});mowerLive().catch(()=>{});setInterval(()=>{if(!document.hidden)mowerLive().catch(()=>{})},120000);setInterval(()=>{if(!document.hidden)livePlugs().catch(()=>{})},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)livePlugs().catch(()=>{})})}).catch(()=>{document.getElementById('main').textContent='Kunne ikke laste data'});
 const lo=document.createElement('p');lo.className='s';lo.style.textAlign='center';lo.innerHTML='<a href="#" id="lo">Logg ut</a>';document.body.appendChild(lo);document.getElementById('lo').onclick=async e=>{e.preventDefault();try{await AUTHC.signOut()}catch(x){}location.reload()}}
(async()=>{const m=document.getElementById('main');m.textContent='Laster …';
 try{AUTHC=(await import('https://esm.sh/@neon/auth@0.8.2')).createAuthClient(AUTH_URL)}catch(e){loginScreen('Kunne ikke laste innloggingen. Prøv igjen senere.');return}
 let s=null;try{s=await AUTHC.getSession()}catch(e){}
 if(!(s&&s.data&&s.data.session)){loginScreen();return}
 const dbg=[];const isJ=t=>typeof t==='string'&&t.split('.').length===3;
 let tok=s.data.session.token;dbg.push('sesjon:'+(tok?(isJ(tok)?'jwt':'ugyldig-form'):'ingen'));
 if(!isJ(tok)){tok=null;try{const t=await AUTHC.token?.();tok=t&&t.data&&t.data.token;dbg.push('token():'+(isJ(tok)?'ok':'tom'))}catch(e){dbg.push('token():feil')}}
 if(!isJ(tok)){tok=null;try{const t=await AUTHC.getJWTToken();tok=t;dbg.push('getJWT:'+(isJ(tok)?'ok':'tom'))}catch(e){dbg.push('getJWT:feil')}}
 if(!isJ(tok)){tok=null;try{const r0=await fetch(AUTH_URL+'/token',{credentials:'include'});dbg.push('/token:'+r0.status);if(r0.ok){const j0=await r0.json();tok=j0.token||null}const h=r0.headers.get('set-auth-jwt');if(!tok&&h)tok=h}catch(e){dbg.push('/token:feil')}}
 if(!isJ(tok)){loginScreen('Fikk ikke token ('+dbg.join(', ')+'). Logg ut og inn på nytt.',true);return}
 let r;try{r=await fetch(FN_URL,{headers:{authorization:'Bearer '+tok}})}catch(e){m.textContent='Kunne ikke nå datatjenesten';return}
 if(r.status===403){loginScreen('Denne kontoen har ikke tilgang.',true);return}
 if(!r.ok){m.textContent='Kunne ikke laste data ('+r.status+')';return}
 FILES=(await r.json()).files||{};start()})();
